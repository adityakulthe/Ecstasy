version: '3.8'

services:
  ecstasy:
    build: .
    container_name: ecstasy-compiler
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
    restart: unless-stopped
