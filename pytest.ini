[pytest]
# Pytest configuration for AI Compiler project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Markers for organizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests across components
    e2e: End-to-end system tests
    slow: Tests that take significant time
    mcp: Tests for MCP server tools
    bob: Tests for Bob agent modes
    ui: Tests for Streamlit UI
    requires_alive2: Tests that require Alive2 installation
    requires_bob: Tests that require IBM Bob access

# Coverage options
[coverage:run]
source = .
omit = 
    tests/*
    */test_*.py
    setup.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

; Made with Bob
