name: Ecstasy CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  test:
    name: Build & Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Clang, LLVM & Z3 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm z3

      - name: Set up Clang, LLVM & Z3 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install z3 || true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e .[dev]

      - name: Run Test Suite with SMT Coverage
        run: |
          pytest -v --tb=short --cov=engine --cov=server --cov=agents --cov-report=xml --cov-report=term

      - name: Verify Ecstasy CLI Diagnostics & Tools Manifest
        run: |
          ecstasy --help
          ecstasy doctor
          ecstasy mcp --list-tools

      - name: Verify Formal Equivalence & Whole-Corpus Benchmark
        run: |
          ecstasy verify tests/fixtures/ipcp_combined.ll tests/fixtures/ipcp_combined.ll
          ecstasy benchmark demo_corpus
          ecstasy demo midpoint

      - name: Verify Provable Cyber Defense (PCD) Security Pipeline
        run: |
          # 1. Audit entire corpus and export OASIS SARIF v2.1.0 report
          ecstasy audit demo_corpus/ --sarif demo_corpus_audit.sarif --report demo_corpus_audit.json

          # 2. SMT Exploit Prover & Vulnerability Dossier
          ecstasy prove demo_corpus/unsafe/buffer_overflow.c --sarif cwe_exploit.sarif

          # 3. SMT-Verified Automated Security Hardening
          ecstasy harden demo_corpus/unsafe/buffer_overflow.c -o /tmp/hardened.ll

          # 4. CycloneDX v1.6 Cryptographic Bill of Materials (CBOM) with NIST SP 800-218 Attestation
          ecstasy cbom demo_corpus/unsafe/buffer_overflow.c -o /tmp/cbom.json

          # 5. Forward-Edge Control-Flow Integrity (CFI) Enforcement
          ecstasy cfi tests/fixtures/combined.ll -o /tmp/cfi.ll

          # 6. MITRE ATT&CK Matrix & Navigator v4.3 Layer
          ecstasy attack-matrix demo_corpus/unsafe/buffer_overflow.c -o /tmp/navigator_layer.json

          # 7. Post-Quantum Cryptography (PQC) Side-Channel Resistance (ML-KEM/Kyber)
          ecstasy pqc tests/fixtures/combined.ll

          # 8. ARM64 Pointer Authentication (PAC) & Memory Tagging Extension (MTE)
          ecstasy pac tests/fixtures/combined.ll -o /tmp/pac.ll

          # 9. in-toto v1.0 Cryptographic Supply Chain Attestation & DSSE Envelope
          ecstasy attest demo_corpus/unsafe/buffer_overflow.c -o /tmp/attestation.json
          ecstasy attest --verify /tmp/attestation.json

          # 10. Speculative Execution & Spectre v1/v2 Side-Channel Defense
          ecstasy spectre tests/fixtures/combined.ll

          # 11. Zero-Source Native Binary Lifter & CFG Reconstructor
          ecstasy lift tests/fixtures/combined.ll -o /tmp/lifted.ll || true

          # 12. Autonomous Self-Healing CI/CD Gatekeeper ("Ecstasy Guard")
          ecstasy guard demo_corpus/unsafe/buffer_overflow.c

          # 13. eBPF Kernel Safety Verifier & Rewriter
          ecstasy ebpf tests/fixtures/combined.ll --rewrite -o /tmp/ebpf_safe.ll

          # 14. Hardware Fault Injection & Dual-Rail Glitch Resilience
          ecstasy fault-resilience tests/fixtures/combined.ll --synthesize -o /tmp/fault_safe.ll

          # 15. Continuous Self-Healing Repository Watcher ("Ecstasy Watch")
          ecstasy watch demo_corpus/ --once

          # 16. Academic & Scientific Artifact Reproduction & Hyperproperty Prover
          ./scripts/reproduce_all_experiments.sh

      - name: Upload OASIS SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && hashFiles('demo_corpus_audit.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: demo_corpus_audit.sarif
          category: ecstasy-provable-cyber-defense

      - name: Upload PCD Compliance & Security Artifacts
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && always()
        with:
          name: ecstasy-cyber-defense-artifacts
          if-no-files-found: warn
          path: |
            demo_corpus_audit.sarif
            cwe_exploit.sarif
            demo_corpus_audit.json
            /tmp/cbom.json
            /tmp/navigator_layer.json
            /tmp/attestation.json
            docs/benchmark_results.tex
            paper/ecstasy_paper.md
            paper/ecstasy_pldi.tex
            ARTIFACT_EVALUATION.md
            coverage.xml
