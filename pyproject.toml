[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecstasy"
version = "1.0.0"
description = "AI-Driven Formally-Verified LLVM Compiler Pipeline with IBM Granite 4.0 and Alive2"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Aditya Kulthe", email = "66123137+adityakulthe@users.noreply.github.com"}
]
dependencies = [
    "ibm-watsonx-ai>=1.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "pydantic>=2.0.0",
    "fastmcp>=0.1.0",
    "z3-solver>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "anyio>=4.0.0",
]

[project.scripts]
ecstasy = "cli:main"

[tool.setuptools]
packages = ["agents", "server", "frontend", "demo"]
py-modules = ["cli"]


